name: feira_mensal_app
description: Aplicativo Flutter para controle simples e organizado de compras de mercado e feira.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de estado
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^16.0.0

  # Banco local (offline first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Datas e moeda
  intl: ^0.20.2

  # IDs únicos
  uuid: ^4.5.1

  # Gráficos
  fl_chart: ^1.0.0

  # Preferências locais
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Ícone do app
  flutter_launcher_icons: ^0.14.4

  # Tela de abertura
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#16A34A"
  image: assets/branding/app_icon.png

  android_12:
    color: "#16A34A"
    image: assets/branding/app_icon.png

  web: false